name: ym-playlist-maker-auth

services:
  auth:
    build: .
    image: ym-playlist-maker:local
    command:
      - python
      - -m
      - ym_playlist_maker
      - auth
      - --client-secrets
      - /run/secrets/google-client.json
      - --bind-address
      - 0.0.0.0
      - --port
      - "${YM_AUTH_PORT:-8080}"
      - --no-browser
    environment:
      YM_DATA_DIR: /app/data
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ${GOOGLE_CLIENT_SECRETS:?Set GOOGLE_CLIENT_SECRETS to the OAuth Desktop client JSON path in .env}
        target: /run/secrets/google-client.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${YM_AUTH_PORT:-8080}:${YM_AUTH_PORT:-8080}"
    restart: "no"
    init: true
