[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-playlist-maker"
version = "0.1.0"
description = "Personal Telegram bot for YouTube Music playlists"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.0,<23",
  "ytmusicapi>=1.10,<2",
  "google-api-python-client>=2.0,<3",
  "google-auth-oauthlib>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

